name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: Quality (lint / typecheck / unit / contracts / build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Task contract audit
        run: npm run task:contract

      - name: Screen contract check (ci mode)
        run: npm run screen:contract -- --mode=ci

      - name: Build
        run: npm run build

  public-smoke:
    name: Public Smoke (Chromium, no login)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Public Smoke (no Supabase secret required)
        run: npm run test:e2e:public

      - name: Upload Playwright report (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
